name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Three independent checks. The audit is the one that catches the slow rot
# (plan numbers drifting from quota.py, emoji creeping back in, README images
# that 404); the other two catch "it does not compile".
jobs:
  audit:
    name: consistency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # stdlib only - no install step, so this can never be flaky
      - run: python3 scripts/audit.py --strict

  backend:
    name: backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt pytest
      # every test is DB-free by design, so no services are needed here
      - run: python -m pytest tests/ -q

  frontend:
    name: frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc -b
      - run: npx vite build
